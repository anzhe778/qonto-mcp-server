version: "3.8"
services:
  qonto-mcp:
    image: ghcr.io/anzhe778/qonto-mcp-server:latest
    container_name: qonto-mcp
    restart: unless-stopped
    ports:
      - "8765:8000"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    environment:
      QONTO_API_KEY: "REPLACE_WITH_YOUR_QONTO_API_KEY"
      QONTO_ORGANIZATION_ID: "prosoma-gmbh-6069"
      QONTO_THIRDPARTY_HOST: "https://thirdparty.qonto.com"
      PYTHONPATH: "/app"
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
    entrypoint: ["python"]
    command:
      - "qonto_mcp/server.py"
      - "--transport"
      - "streamable-http"
